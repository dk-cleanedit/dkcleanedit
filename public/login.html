<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | DKcleanedit</title>

  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="darkmode.css" />
</head>
<body class="login-page">
  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <li class="nav-logo">
        <a href="home.html" aria-label="Go to home page">
          <img src="videos/logo.png" class="logo" alt="DKcleanedit logo" />
        </a>
      </li>

      <li><a href="home.html" id="navHome">Home</a></li>
      <li><a href="booking.html" id="navBooking" data-requires-auth="true">Booking</a></li>
      <li><a href="track.html" id="navTracking" data-requires-auth="true">Tracking</a></li>
      <li><a href="customer.html" id="navAccount" data-requires-auth="true">My Account</a></li>
      <li><a href="admin.html" id="navAdmin" data-requires-auth="true">Admin</a></li>
      <li><a href="login.html" id="navLogin" aria-current="page">Login</a></li>
      <li><a href="register.html" id="navRegister">Register</a></li>
      <li><a href="#" id="navLogout" hidden>Logout</a></li>
      <li><span id="navPointsBadge" class="badge info" hidden>Points: 0</span></li>
    </ul>
  </nav>

  <main class="login-container">
    <section class="login-card" aria-labelledby="loginTitle">
      <p class="login-sub">DKcleanedit</p>
      <h1 class="login-title" id="loginTitle">Welcome back</h1>
      <p class="login-text">Sign in to manage bookings, track orders, and view your account details.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="login-label" for="logEmail">Email address</label>
          <input
            id="logEmail"
            class="login-input"
            type="email"
            autocomplete="email"
            placeholder="you@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label class="login-label" for="logPass">Password</label>
          <input
            id="logPass"
            class="login-input"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          />
        </div>

        <button id="btnLogin" class="btn primary full login-btn" type="button">
          Login
        </button>

        <button id="btnRegisterGo" class="btn secondary full register-btn" type="button">
          Create account
        </button>

        <p id="msg" class="login-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./theme.js"></script>
</body>
</html>
