<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | DKCleanEdit</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page">
  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <li><a href="home.html" id="navHome">Home</a></li>

      <li><a href="booking.html" id="navBooking" data-requires-auth="true">Booking</a></li>
      <li><a href="track.html" id="navTracking" data-requires-auth="true">Tracking</a></li>
      <li><a href="customer.html" id="navAccount" data-requires-auth="true">My Account</a></li>
      <li><a href="admin.html" id="navAdmin" data-requires-auth="true">Admin</a></li>

      <li><a href="login.html" id="navLogin" aria-current="page">Login</a></li>
      <li><a href="register.html" id="navRegister">Register</a></li>

      <li><a href="#" id="navLogout" hidden>Logout</a></li>
      <li><span id="navPointsBadge" class="badge" hidden>Points: 0</span></li>
    </ul>
  </nav>

  <main class="container login-container">
    <section class="card login-card">
      <p class="login-sub">Please enter your details</p>
      <h1 class="login-title">Welcome back</h1>

      <label for="logEmail" class="login-label">Email address</label>
      <input id="logEmail" class="login-input" type="email" autocomplete="email" />

      <label for="logPass" class="login-label">Password</label>
      <input id="logPass" class="login-input" type="password" autocomplete="current-password" />

      <button id="btnLogin" class="btn primary full login-btn" type="button">Login</button>
      <button id="btnRegisterGo" class="btn secondary full register-btn" type="button">Register</button>

      <p id="msg" class="login-message"></p>
    </section>
  </main>

  <script type="module" src="./app.js" defer></script>
</body>
</html>
