<!doctype html>
<html lang="en">
<!--
  login.html — DKcleanedit
  References:
  [1] Bootdey (n.d.) "2-step verification form inside a card."
      https://www.bootdey.com/snippets/view/2-step-verification-form-inside-a-card#css
      (Accessed: 27 Apr. 2026). Adapted for the 2FA OTP input step.
  [2] Firebase Auth docs — https://firebase.google.com/docs/auth (Accessed: 27 Apr. 2026).
  [3] EmailJS — https://www.emailjs.com (Accessed: 27 Apr. 2026).
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | DKcleanedit</title>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
  <link rel="stylesheet" href="token.css" />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>(function(){ emailjs.init({ publicKey: "v1GO4hYhLibhbnt_N" }); })();</script>
</head>
<body class="auth-page">

  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <li class="nav-logo">
        <a href="home.html" aria-label="DKcleanedit home">
          <img src="videos/logo.png" class="logo" alt="DKcleanedit logo" />
        </a>
      </li>
      <li><a href="home.html" id="navHome">Home</a></li>
      <li><a href="login.html" id="navLogin" aria-current="page">Login</a></li>
      <li><a href="register.html" id="navRegister">Register</a></li>
    </ul>
  </nav>

  <main class="auth-container">
    <section class="auth-card" aria-labelledby="loginTitle">

      <div class="auth-brand">
        <span class="auth-eyebrow">DKcleanedit</span>
      </div>

      <!-- Step 1: credentials -->
      <div id="loginStep">
        <h1 class="auth-title" id="loginTitle">Welcome back</h1>
        <p class="auth-sub">Sign in to book services, track orders and earn rewards.</p>

        <form id="loginForm" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="logEmail">Email address</label>
            <input
              id="logEmail"
              class="auth-input"
              type="email"
              autocomplete="username"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="auth-field">
            <label class="auth-label" for="logPass">Password</label>
            <input
              id="logPass"
              class="auth-input"
              type="password"
              autocomplete="current-password"
              placeholder="Your password"
              required
            />
          </div>

          <p id="loginMsg" class="auth-msg" role="alert" aria-live="assertive"></p>

          <button id="btnLogin" class="btn primary full" type="submit">
            Sign in
          </button>
        </form>

        <p class="auth-foot">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>
      </div>

      <!-- Step 2: 2FA OTP — hidden until credentials pass -->
      <!-- Adapted from Ref [1] (Bootdey 2-step verification card) -->
      <div id="twoFactorStep" hidden>
        <h2 class="auth-title" style="font-size:1.8rem;">Check your email</h2>
        <p class="auth-sub">
          We sent a 4-digit code to <strong id="twoFAEmailHint"></strong>.
          Enter it below to complete sign-in.
        </p>

        <div class="twofa-inputs" aria-label="One-time passcode">
          <input class="twofa-input" type="text" inputmode="numeric"
                 maxlength="1" aria-label="Digit 1" autocomplete="one-time-code" />
          <input class="twofa-input" type="text" inputmode="numeric"
                 maxlength="1" aria-label="Digit 2" />
          <input class="twofa-input" type="text" inputmode="numeric"
                 maxlength="1" aria-label="Digit 3" />
          <input class="twofa-input" type="text" inputmode="numeric"
                 maxlength="1" aria-label="Digit 4" />
        </div>

        <p id="twofaMsg" class="auth-msg" role="alert" aria-live="polite"></p>

        <button id="btnVerify2FA" class="btn primary full" type="button">
          Verify code
        </button>

        <p class="auth-foot" style="margin-top:16px;">
          Didn't get it?
          <button id="resendCode" class="btn-link" type="button">Resend code</button>
        </p>
      </div>

    </section>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
