<!doctype html>
<html lang="en">

  admin.html — DKcleanedit Admin Orders

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Orders | DKcleanedit</title>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
  <link rel="stylesheet" href="token.css" />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="order-tracking.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="staff.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>(function(){ emailjs.init({ publicKey: "v1GO4hYhLibhbnt_N" }); })();</script>
</head>
<body class="admin-body">

  <!-- Admin navbar — no My Account, no booking/tracking links for admin -->
  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <li class="nav-logo">
        <a href="home.html" aria-label="DKcleanedit home">
          <img src="videos/logo.png" class="logo" alt="DKcleanedit logo" />
        </a>
      </li>
      <li><a href="admin.html"    id="navAdmin"    aria-current="page">Orders</a></li>
      <li><a href="schedule.html" id="navSchedule">Schedule</a></li>
      <li><a href="analytics.html"id="navAnalytics">Analytics</a></li>
      <li><a href="admin_account.html" id="navStaff">Staff</a></li>
      <li><a href="#"             id="navLogout" hidden>Logout</a></li>
      <li>
        <span id="navPointsBadge" class="badge info points-badge" hidden>0 pts</span>
      </li>
    </ul>
  </nav>

  <main class="container admin-layout">

    <!-- Sidebar -->
    <aside class="card admin-sidebar">
      <div class="admin-brand">
        <div class="brand-title">DKcleanedit</div>
        <div class="sub">Admin dashboard</div>
      </div>
      <nav class="admin-side-nav" style="margin-top:14px;">
        <a class="admin-side-link active" href="admin.html">Orders</a>
        <a class="admin-side-link" href="schedule.html">Schedule</a>
        <a class="admin-side-link" href="analytics.html">Analytics</a>
        <a class="admin-side-link" href="admin_account.html">Staff</a>
      </nav>

      <!-- Debug info -->
      <div class="admin-debug sub" style="margin-top:auto;padding-top:16px;border-top:1px solid var(--line);">
        <div>UID: <span id="debugUid">—</span></div>
        <div>Role: <span id="debugRole">—</span></div>
      </div>
    </aside>

    <!-- Main panel -->
    <div class="admin-main">

      <!-- Stats row -->
      <div class="admin-stats">
        <div class="card admin-stat-box">
          <div class="admin-stat-lbl">Total</div>
          <div class="admin-stat-val" id="adminTotalOrders">—</div>
        </div>
        <div class="card admin-stat-box">
          <div class="admin-stat-lbl">Open</div>
          <div class="admin-stat-val" id="adminOpenOrders">—</div>
        </div>
        <div class="card admin-stat-box">
          <div class="admin-stat-lbl">Completed</div>
          <div class="admin-stat-val" id="adminCompletedOrders">—</div>
        </div>
        <div class="card admin-stat-box">
          <div class="admin-stat-lbl">Conflicts</div>
          <div class="admin-stat-val" id="conflictCount">0</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab active" data-tab="orders"      role="tab" aria-selected="true">All Orders</button>
        <button class="admin-tab"        data-tab="today"       role="tab" aria-selected="false">Today</button>
        <button class="admin-tab"        data-tab="appointment" role="tab" aria-selected="false">Missed</button>
        <button class="admin-tab"        data-tab="history"     role="tab" aria-selected="false">History</button>
        <button class="admin-tab"        data-tab="availability"role="tab" aria-selected="false">Availability</button>
      </div>

      <!-- Search / filter bar -->
      <div class="admin-toolbar">
        <input id="adminSearch" class="admin-search" type="search"
               placeholder="Search orders, customers, IDs…" aria-label="Search orders" />
        <select id="adminFilter" class="admin-filter" aria-label="Filter by status">
          <option value="All">All statuses</option>
          <option>Booked</option>
          <option>Received</option>
          <option>Cleaning</option>
          <option>Drying &amp; Finish</option>
          <option>Ready</option>
          <option>Awaiting Pickup</option>
          <option>Completed</option>
          <option>Cancelled</option>
        </select>
        <button id="btnExportCSV" class="btn secondary">Export CSV</button>
        <button id="btnAdminRefresh" class="btn">Refresh</button>
      </div>

      <!-- Tab panels -->
      <div class="admin-tab-panel active" id="tabOrders">
        <div id="adminOrders" class="orders-grid">
          <div class="order-card"><div class="order-title">Loading orders…</div></div>
        </div>
      </div>

      <div class="admin-tab-panel" id="tabToday">
        <div class="card" style="padding:16px 20px;margin-bottom:16px;">
          <strong id="todayLabel">Today's bookings</strong>
        </div>
        <div id="scheduleList" class="orders-grid"></div>
      </div>

      <div class="admin-tab-panel" id="tabAppointment">
        <!-- Missed appointments rendered by admin.js -->
      </div>

      <div class="admin-tab-panel" id="tabHistory">
        <h3 style="margin:0 0 16px;" class="sub">
          Archived / dismissed
          <span id="cancelledHistoryCount"></span>
        </h3>
        <div id="cancelledHistory" class="orders-grid"></div>
      </div>

      <div class="admin-tab-panel" id="tabAvailability">
        <div class="card" style="padding:20px;">
          <h3 style="margin:0 0 16px;">Manage slot availability</h3>
          <div class="avail-cal-head">
            <button id="availPrev" class="btn" aria-label="Previous month">‹</button>
            <span id="availMonthLabel" style="font-weight:700;"></span>
            <button id="availNext" class="btn" aria-label="Next month">›</button>
          </div>
          <div class="cal-days-header" aria-hidden="true">
            <span>Su</span><span>Mo</span><span>Tu</span>
            <span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
          </div>
          <div id="availCalBody" class="cal-body" role="grid" aria-label="Select a date"></div>
          <div id="availSlotEditor" style="display:none;margin-top:16px;">
            <p class="sub" id="availSelectedLabel"></p>
            <div id="availSlotGrid" class="avail-slot-grid"></div>
            <div style="display:flex;gap:10px;margin-top:12px;">
              <button id="btnAvailOpenAll"  class="btn secondary">Open all</button>
              <button id="btnAvailCloseAll" class="btn secondary">Close all</button>
              <button id="btnAvailSave"     class="btn primary">Save</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
