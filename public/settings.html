<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>setting</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <img src="videos/logo.png" class="logo" alt="DKCleanEdit Logo" />
      <li><a href="home.html" id="navHome">Home</a></li>
      <li><a href="booking.html" id="navBooking" data-requires-auth="true">Booking</a></li>
      <li><a href="track.html" id="navTracking" data-requires-auth="true">Tracking</a></li>
      <li><a href="admin.html" id="navAdmin" data-requires-auth="true">Admin</a></li>
      <li><a href="login.html" id="navLogin">Login</a></li>
      <li><a href="register.html" id="navRegister">Register</a></li>
      <li><a href="#" id="navLogout" hidden>Logout</a></li>
      <li><span id="navPointsBadge" class="badge" hidden>Points: 0</span></li>

      <li><a href="settings.html"><img class="PicSettings" src="https://img.icons8.com/ios-filled/100/666666/settings.png"></a></li>
    </ul>
  </nav>

  <div class="Switch box">
    <div class="Swittext">Background colour</div>
    <input type="checkbox" class="switch" id="themeToggle">
    <label for="themeToggle" class="Darkmode"></label>
  </div>

  <main class="container customer-layout">
    <section class="card account-card">
      <h1>Welcome back</h1>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-title">Name</div>
          <div class="stat-value" id="custName">-</div>
        </div>

        <div class="stat">
          <div class="stat-title">Profile picture</div>
          <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="img" alt="Profile picture" />
          <input type="file" class="profile-upload" />
          <div class="stat-value" id="custPicture">-</div>
        </div>

        <div class="stat">
          <div class="stat-title">Email</div>
          <div class="stat-value" id="custEmail">-</div>
        </div>

        <div class="stat">
          <div class="stat-title">Loyalty Points</div>
          <div class="stat-value" id="custPoints">0</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
