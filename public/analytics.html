<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analytics | DKCleanEdit</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">
  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="track.html">Tracking</a></li>
      <li><a href="customer.html">My Account</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li><a href="analytics.html" aria-current="page">Analytics</a></li>
        <li><a href="settings.html">Settings</a></li>
    </ul>
  </nav>

  <main class="container admin-layout">
      <nav class="admin-nav">
        <a class="admin-link" href="admin.html">Orders</a>
        <a class="admin-link active" href="analytics.html">Analytics</a>
      </nav>
    </aside>

    <section class="card admin-main">
      <header class="admin-header">
        <div>
          <h1>Analytics</h1>
          <p class="sub">Business performance and order trends.</p>
        </div>
      </header>

      <section class="kpi-grid">
        <div class="card kpi-card"><h3>Total Orders</h3><p id="kpiTotal">0</p></div>
        <div class="card kpi-card"><h3>Completed</h3><p id="kpiCompleted">0</p></div>
        <div class="card kpi-card"><h3>Active</h3><p id="kpiActive">0</p></div>
        <div class="card kpi-card"><h3>Cancelled</h3><p id="kpiCancelled">0</p></div>
        <div class="card kpi-card"><h3>Points Awarded</h3><p id="kpiPoints">0</p></div>
        <div class="card kpi-card"><h3>Repeat Customers</h3><p id="kpiRepeat">0</p></div>
      </section>

      <section class="chart-grid">
        <div class="card"><canvas id="statusChart"></canvas></div>
        <div class="card"><canvas id="serviceChart"></canvas></div>
        <div class="card"><canvas id="locationChart"></canvas></div>
        <div class="card"><canvas id="dayChart"></canvas></div>
        <div class="card"><canvas id="timeSlotChart"></canvas></div>
        <div class="card"><canvas id="pointsChart"></canvas></div>
      </section>
    </section>
  </main>

<script type="module" src="./analytics.js"></script>
</body>
</html>
