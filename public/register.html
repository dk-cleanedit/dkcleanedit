<!doctype html>
<html lang="en">
<!--
  register.html — DKcleanedit
  References:
  [1] Firebase Auth — https://firebase.google.com/docs/auth (Accessed: 27 Apr. 2026).
  [2] 100 JS Projects — form validation pattern (Accessed: 27 Apr. 2026).
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | DKcleanedit</title>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
  <link rel="stylesheet" href="token.css" />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">

  <nav class="navbar" aria-label="Primary">
    <ul class="nav-links">
      <li class="nav-logo">
        <a href="home.html" aria-label="DKcleanedit home">
          <img src="videos/logo.png" class="logo" alt="DKcleanedit logo" />
        </a>
      </li>
      <li><a href="home.html" id="navHome">Home</a></li>
      <li><a href="login.html" id="navLogin">Login</a></li>
      <li><a href="register.html" id="navRegister" aria-current="page">Register</a></li>
    </ul>
  </nav>

  <main class="auth-container">
    <section class="auth-card" aria-labelledby="registerTitle">

      <div class="auth-brand">
        <span class="auth-eyebrow">DKcleanedit</span>
      </div>

      <h1 class="auth-title" id="registerTitle">Create account</h1>
      <p class="auth-sub">Join to book services, track orders and earn loyalty points.</p>

      <form id="registerForm" novalidate>

        <div class="auth-field">
          <label class="auth-label" for="regName">Full name</label>
          <input
            id="regName"
            class="auth-input"
            type="text"
            autocomplete="name"
            placeholder="Your full name"
            required
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="regEmail">Email address</label>
          <input
            id="regEmail"
            class="auth-input"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="regPhone">Phone number <span class="auth-opt">(optional)</span></label>
          <input
            id="regPhone"
            class="auth-input"
            type="tel"
            autocomplete="tel"
            placeholder="+44 7700 000000"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="regPass">Password</label>
          <input
            id="regPass"
            class="auth-input"
            type="password"
            autocomplete="new-password"
            placeholder="Minimum 8 characters"
            minlength="8"
            required
          />
          <span class="auth-hint">Must be at least 8 characters.</span>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="regPassConfirm">Confirm password</label>
          <input
            id="regPassConfirm"
            class="auth-input"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat your password"
            required
          />
        </div>

        <p id="registerMsg" class="auth-msg" role="alert" aria-live="assertive"></p>

        <button id="btnRegister" class="btn primary full" type="submit">
          Create account
        </button>

      </form>

      <p class="auth-foot">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </section>
  </main>

  <script type="module" src="./register.js"></script>
</body>
</html>
